name: Verificación

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Analizar código
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build
        env:
          # La compilación no necesita credenciales reales: las páginas se
          # renderizan bajo demanda y la configuración tiene valores de respaldo.
          NEXT_PUBLIC_SUPABASE_URL: https://demostracion.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-compilacion
