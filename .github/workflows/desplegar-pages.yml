name: Desplegar en Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['site/**', '.github/workflows/desplegar-pages.yml']

concurrency:
  group: pages-ciess-riuss-congreso
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROYECTO: ciess-riuss-congreso

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Colocar el identificador de la base D1
        run: |
          if [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then
            echo "Falta el secreto D1_DATABASE_ID (lo devuelve 'wrangler d1 create ciess-riuss-congreso')." >&2
            exit 1
          fi
          sed -i "s|PENDIENTE-COPIAR-DE-WRANGLER-D1-CREATE|${{ secrets.D1_DATABASE_ID }}|" wrangler.toml

      - name: Crear el proyecto de Pages si aún no existe
        run: |
          if ! npx wrangler pages project list | grep -q "$PROYECTO"; then
            npx wrangler pages project create "$PROYECTO" --production-branch=main
          fi

      - name: Aplicar el esquema de la base de datos
        run: npx wrangler d1 execute "$PROYECTO" --remote --file=schema.sql --yes

      - name: Cargar los secretos del panel
        env:
          PANEL_USUARIO: ${{ secrets.PANEL_USUARIO }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -z "$PANEL_PASSWORD" ]; then
            echo "Falta el secreto PANEL_PASSWORD: el panel quedaría sin acceso." >&2
            exit 1
          fi
          printf '%s' "${PANEL_USUARIO:-Admin}" | npx wrangler pages secret put PANEL_USUARIO --project-name="$PROYECTO"
          printf '%s' "$PANEL_PASSWORD" | npx wrangler pages secret put PANEL_PASSWORD --project-name="$PROYECTO"
          if [ -n "$SESSION_SECRET" ]; then
            printf '%s' "$SESSION_SECRET" | npx wrangler pages secret put SESSION_SECRET --project-name="$PROYECTO"
          fi

      - name: Publicar el sitio
        run: npx wrangler pages deploy --project-name="$PROYECTO" --branch=main --commit-dirty=true

      - name: Dirección publicada
        run: echo "Sitio disponible en https://$PROYECTO.pages.dev"
